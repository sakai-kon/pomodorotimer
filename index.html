<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c2c2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>勉強ポモドーロタイマー</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f2ec;--surface:#fff;--text:#2c2c2a;--muted:#5f5e5a;--border:#e0ddd3;--input:#faf9f5;--input-border:#d3d1c7;--stat:#f1efe8}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.app{width:100%;max-width:520px;margin:0 auto}
h1{font-size:19px;font-weight:500;text-align:center;margin:0 0 12px}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.mode-label{text-align:center;font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;display:inline-block;margin:0 auto 10px}.mode-wrap{text-align:center}.mode-work{background:#FAECE7;color:#712B13}.mode-short{background:#E1F5EE;color:#085041}.mode-long{background:#E6F1FB;color:#0C447C}
.timer{font-size:clamp(50px,17vw,66px);font-weight:500;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 14px;letter-spacing:1px;line-height:1}
.task-input,.memo-input{width:100%;border:.5px solid var(--input-border);border-radius:8px;padding:9px 11px;font-size:14px;background:var(--input);font-family:inherit}.task-input{height:40px;margin-bottom:10px}.memo-input{height:86px;min-height:86px;resize:none;line-height:1.45}.task-input:focus,.memo-input:focus{outline:none;border-color:#7F77DD}
.controls{display:flex;gap:8px}.controls button{flex:1}.memo-controls{display:flex;gap:8px;margin-top:8px}.memo-controls button{height:36px;min-height:36px;font-size:13px}
button{min-width:0;min-height:44px;height:44px;border-radius:9px;border:.5px solid var(--input-border);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;color:var(--text);font-family:inherit;touch-action:manipulation}.btn-primary{background:#2c2c2a;color:#fff;border:none}.btn-reset{flex:0 0 44px}.memo-status{margin-top:6px;font-size:10px;color:#888780;text-align:right;min-height:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:var(--stat);border-radius:9px;padding:10px 8px;text-align:center}.stat .num{font-size:20px;font-weight:500}.stat .label{font-size:11px;color:var(--muted);margin-top:1px}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.settings label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}.settings input{width:100%;height:36px;border:.5px solid var(--input-border);border-radius:8px;text-align:center;font-size:13px;background:var(--input);font-family:inherit}.settings input:focus{outline:none;border-color:#7F77DD}
.log{max-height:120px;overflow-y:auto;font-size:12px;-webkit-overflow-scrolling:touch}.log-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:.5px solid #efeee8;color:var(--muted)}.log-item:last-child{border-bottom:none}.log-title{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;color:#888780;font-size:12px;padding:6px 0}
@media (min-width:760px){
 body{padding:40px 32px}
 .app{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(360px,.85fr);grid-template-rows:auto auto;gap:22px;align-items:start}
 h1{grid-column:1/-1;font-size:28px;margin:0 0 -2px;text-align:left;padding-left:4px}
 .card{margin:0;border-radius:18px;padding:30px}
 .app>.card:nth-of-type(1){grid-column:1;grid-row:2;min-height:430px;display:flex;flex-direction:column;justify-content:center}
 .app>.card:nth-of-type(2){grid-column:2;grid-row:2}
 .app>.card:nth-of-type(3){grid-column:1;grid-row:3}
 .app>.card:nth-of-type(4){grid-column:2;grid-row:3}
 .timer{font-size:clamp(82px,8vw,118px);margin:20px 0 26px;letter-spacing:3px}
 .mode-label{font-size:14px;padding:7px 14px;margin-bottom:8px}
 .task-input{height:48px;margin-bottom:16px}.controls{gap:12px}.controls button{height:52px}.btn-reset{flex-basis:52px}
 .memo-input{height:230px;min-height:230px;resize:vertical}.memo-controls button{height:42px}.log{max-height:330px}.stat{padding:16px 12px}.stat .num{font-size:24px}.settings input{height:40px;font-size:14px}.settings label{font-size:11px}
}
@media (min-width:1200px){.app{grid-template-columns:minmax(0,1.7fr) minmax(400px,.8fr);gap:26px}.app>.card:nth-of-type(1){min-height:500px}.card{padding:34px}.timer{font-size:120px}}
@media (max-width:380px){.card{padding:14px;margin-bottom:10px}.timer{font-size:48px;margin-bottom:10px}.task-input{height:38px}.controls button{height:42px;min-height:42px}.btn-reset{flex-basis:42px}.memo-input{height:72px;min-height:72px}.settings input{height:34px;font-size:12px}.settings label{font-size:9px}.stat{padding:8px 6px}.stat .num{font-size:18px}.log{max-height:90px}}
@media (max-height:720px) and (max-width:759px){body{padding-top:8px;padding-bottom:8px}.app{max-width:500px}h1{font-size:18px;margin-bottom:8px}.card{padding:12px;margin-bottom:8px}.timer{font-size:48px;margin:2px 0 8px}.task-input{height:36px;margin-bottom:7px}.controls button{height:40px;min-height:40px}.memo-input{height:64px;min-height:64px}.memo-controls{margin-top:6px}.memo-controls button{height:32px;min-height:32px}.stat{padding:7px 6px}.settings{margin-top:7px}.settings input{height:32px}.log{max-height:78px}}
</style>
</head>
<body>
<div class="app">
<h1>勉強ポモドーロタイマー</h1>
<div class="card"><div class="mode-wrap"><span class="mode-label mode-work" id="modeLabel">集中タイム</span></div><div class="timer" id="display">25:00</div><input type="text" class="task-input" id="taskInput" placeholder="今何を勉強していますか？（例：数学の宿題）"><div class="controls"><button class="btn-primary" id="startBtn">開始</button><button id="skipBtn">スキップ</button><button class="btn-reset" id="resetBtn" title="リセット">↺</button></div></div>
<div class="card"><div style="font-size:13px;font-weight:500;margin-bottom:7px;color:#5f5e5a;">メモ</div><textarea class="memo-input" id="memoInput" placeholder="今日の勉強メモを書いておこう…"></textarea><div class="memo-controls"><button id="memoSaveBtn">保存</button><button id="memoClearBtn">クリア</button></div><div class="memo-status" id="memoStatus">自動保存されています</div></div>
<div class="card"><div class="stats"><div class="stat"><div class="num" id="sessionCount">0</div><div class="label">完了ポモドーロ</div></div><div class="stat"><div class="num" id="totalMinutes">0分</div><div class="label">今日の学習時間</div></div></div><div class="settings"><div><label>集中(分)</label><input type="number" id="workMin" value="25" min="1" max="90"></div><div><label>小休憩(分)</label><input type="number" id="shortMin" value="5" min="1" max="30"></div><div><label>長休憩(分)</label><input type="number" id="longMin" value="15" min="1" max="60"></div></div></div>
<div class="card"><div style="font-size:13px;font-weight:500;margin-bottom:7px;color:#5f5e5a;">記録</div><div class="log" id="log"><div class="empty">まだ記録がありません</div></div></div>
</div>
<script>
const STORAGE_KEY='pomodoroTimerStateV2';
let workMin=25,shortMin=5,longMin=15,mode='work',secondsLeft=workMin*60,running=false,timerId=null,endAt=null,sessionCount=0,totalStudySeconds=0,history=[];
const display=document.getElementById('display'),modeLabel=document.getElementById('modeLabel'),startBtn=document.getElementById('startBtn'),skipBtn=document.getElementById('skipBtn'),resetBtn=document.getElementById('resetBtn'),taskInput=document.getElementById('taskInput'),sessionCountEl=document.getElementById('sessionCount'),totalMinutesEl=document.getElementById('totalMinutes'),logEl=document.getElementById('log'),workMinInput=document.getElementById('workMin'),shortMinInput=document.getElementById('shortMin'),longMinInput=document.getElementById('longMin'),memoInput=document.getElementById('memoInput'),memoSaveBtn=document.getElementById('memoSaveBtn'),memoClearBtn=document.getElementById('memoClearBtn'),memoStatus=document.getElementById('memoStatus');
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatTime(s){s=Math.max(0,Math.floor(s));const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function modeDuration(m){if(m==='work')return workMin*60;if(m==='short')return shortMin*60;return longMin*60}
function updateModeLabel(){modeLabel.classList.remove('mode-work','mode-short','mode-long');if(mode==='work'){modeLabel.textContent='集中タイム';modeLabel.classList.add('mode-work')}else if(mode==='short'){modeLabel.textContent='小休憩';modeLabel.classList.add('mode-short')}else{modeLabel.textContent='長休憩';modeLabel.classList.add('mode-long')}}
function render(){display.textContent=formatTime(secondsLeft);sessionCountEl.textContent=sessionCount;totalMinutesEl.textContent=Math.floor(totalStudySeconds/60)+'分';startBtn.textContent=running?'一時停止':'開始';updateModeLabel();document.title=formatTime(secondsLeft)+' - 勉強ポモドーロタイマー'}
function addLog(text){history.unshift({text,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});if(history.length>20)history.pop();renderLog()}
function renderLog(){if(history.length===0){logEl.innerHTML='<div class="empty">まだ記録がありません</div>';return}logEl.innerHTML=history.map(h=>'<div class="log-item"><span class="log-title">'+escapeHtml(h.text)+'</span><span>'+escapeHtml(h.time)+'</span></div>').join('')}
function escapeHtml(text){return String(text).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function saveState(){const state={date:todayKey(),workMin,shortMin,longMin,mode,secondsLeft,running,endAt,sessionCount,totalStudySeconds,history,task:taskInput.value,memo:memoInput.value};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function loadState(){let saved=null;try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){}if(!saved||typeof saved!=='object'){renderLog();render();saveState();return}workMin=Number(saved.workMin)>0?Math.min(Number(saved.workMin),90):25;shortMin=Number(saved.shortMin)>0?Math.min(Number(saved.shortMin),30):5;longMin=Number(saved.longMin)>0?Math.min(Number(saved.longMin),60):15;workMinInput.value=workMin;shortMinInput.value=shortMin;longMinInput.value=longMin;taskInput.value=saved.task||'';memoInput.value=saved.memo||'';if(saved.date!==todayKey()){mode='work';secondsLeft=modeDuration('work');running=false;endAt=null;sessionCount=0;totalStudySeconds=0;history=[]}else{mode=['work','short','long'].includes(saved.mode)?saved.mode:'work';secondsLeft=Math.max(0,Number(saved.secondsLeft)||modeDuration(mode));running=saved.running===true;endAt=Number(saved.endAt)||null;sessionCount=Math.max(0,Number(saved.sessionCount)||0);totalStudySeconds=Math.max(0,Number(saved.totalStudySeconds)||0);history=Array.isArray(saved.history)?saved.history.slice(0,20):[]}renderLog();render()}
function playBeep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=880;gain.gain.setValueAtTime(.15,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);osc.start();osc.stop(ctx.currentTime+.6)}catch(e){}}
function completeCurrentMode(){if(mode==='work'){sessionCount++;totalStudySeconds+=workMin*60;const taskName=taskInput.value.trim()||'無題のタスク';addLog('完了：'+taskName);mode=sessionCount%4===0?'long':'short'}else{addLog(mode==='long'?'長休憩終了':'小休憩終了');mode='work'}secondsLeft=modeDuration(mode)}
function nextMode(){clearInterval(timerId);running=false;endAt=null;completeCurrentMode();render();saveState()}
function processElapsedTime(){if(!running||!endAt)return;const now=Date.now();if(now<endAt){secondsLeft=Math.max(0,Math.ceil((endAt-now)/1000));return}let transitionCount=0;while(now>=endAt&&transitionCount<100){playBeep();completeCurrentMode();transitionCount++;endAt+=modeDuration(mode)*1000}secondsLeft=Math.max(0,Math.ceil((endAt-now)/1000));if(transitionCount>1)addLog(transitionCount+'セッション分を自動反映');renderLog();render();saveState()}
function tick(){if(!running)return;processElapsedTime();if(running)render()}
function start(){if(running){const remaining=endAt?Math.max(0,Math.ceil((endAt-Date.now())/1000)):secondsLeft;secondsLeft=remaining;running=false;endAt=null;clearInterval(timerId)}else{if(secondsLeft<=0)secondsLeft=modeDuration(mode);running=true;endAt=Date.now()+secondsLeft*1000;clearInterval(timerId);timerId=setInterval(tick,500)}render();saveState()}
function skip(){nextMode()}
function reset(){clearInterval(timerId);running=false;endAt=null;mode='work';applySettings();secondsLeft=modeDuration(mode);sessionCount=0;totalStudySeconds=0;history=[];renderLog();render();saveState()}
function applySettings(){const w=parseInt(workMinInput.value,10),s=parseInt(shortMinInput.value,10),l=parseInt(longMinInput.value,10);workMin=w>0?Math.min(w,90):25;shortMin=s>0?Math.min(s,30):5;longMin=l>0?Math.min(l,60):15;workMinInput.value=workMin;shortMinInput.value=shortMin;longMinInput.value=longMin}
function saveMemo(statusText){memoStatus.textContent=statusText||'保存しました';saveState()}
[workMinInput,shortMinInput,longMinInput].forEach(el=>el.addEventListener('change',()=>{const wasRunning=running;if(wasRunning){const remaining=endAt?Math.max(0,Math.ceil((endAt-Date.now())/1000)):secondsLeft;running=false;endAt=null;clearInterval(timerId);secondsLeft=remaining}applySettings();if(mode==='work'||!wasRunning)secondsLeft=Math.min(secondsLeft,modeDuration(mode));if(wasRunning){running=true;endAt=Date.now()+secondsLeft*1000;timerId=setInterval(tick,500)}render();saveState()}));
taskInput.addEventListener('input',saveState);
memoInput.addEventListener('input',()=>{memoStatus.textContent='自動保存中…';clearTimeout(memoInput._saveTimer);memoInput._saveTimer=setTimeout(()=>saveMemo('自動保存しました'),300)});
memoSaveBtn.addEventListener('click',()=>saveMemo('保存しました'));
memoClearBtn.addEventListener('click',()=>{memoInput.value='';saveMemo('メモをクリアしました')});
startBtn.addEventListener('click',start);skipBtn.addEventListener('click',skip);resetBtn.addEventListener('click',reset);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){processElapsedTime();saveState()}});window.addEventListener('beforeunload',saveState);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadState();processElapsedTime();if(running)timerId=setInterval(tick,500);
</script>
</body>
</html>
