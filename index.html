<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2c2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>勉強ポモドーロタイマー</title>
<style>
*{box-sizing:border-box} :root{--bg:#f4f2ec;--surface:#fff;--text:#2c2c2a;--muted:#5f5e5a;--border:#e0ddd3;--input:#faf9f5;--ib:#d3d1c7;--stat:#f1efe8}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh;min-height:100dvh;padding:14px max(12px,env(safe-area-inset-right)) 18px max(12px,env(safe-area-inset-left))}
.app{width:100%;max-width:540px;margin:auto}h1{font-size:19px;font-weight:500;text-align:center;margin:0 0 12px}.card{background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}.section-title{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
.mode-wrap{text-align:center}.mode-label{font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;display:inline-block}.mode-work{background:#FAECE7;color:#712B13}.mode-short{background:#E1F5EE;color:#085041}.mode-long{background:#E6F1FB;color:#0C447C}
.timer{font-size:clamp(50px,17vw,68px);font-weight:500;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1;margin:12px 0 14px}.task,.memo,.select,.number,.goal-input{width:100%;border:.5px solid var(--ib);border-radius:8px;background:var(--input);font:inherit;color:var(--text)}.task{height:40px;padding:8px 11px;margin-bottom:8px}.memo{height:72px;min-height:72px;padding:8px 11px;resize:vertical;line-height:1.45}.select,.number,.goal-input{height:38px;padding:0 9px;font-size:13px}.task:focus,.memo:focus,.select:focus,.number:focus,.goal-input:focus{outline:none;border-color:#7F77DD}
.controls,.row,.memo-controls{display:flex;gap:8px}.controls button,.row button,.memo-controls button{flex:1}button{min-width:0;height:42px;border:0.5px solid var(--ib);border-radius:9px;background:var(--surface);font:inherit;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;touch-action:manipulation}.primary{background:#2c2c2a;color:#fff;border:none}.reset{flex:0 0 42px!important}.memo-controls{margin-top:7px}.memo-controls button{height:36px;font-size:12px}.status{min-height:14px;margin-top:5px;font-size:10px;color:#888780;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{background:var(--stat);border-radius:9px;text-align:center;padding:10px 7px}.num{font-size:20px;font-weight:500}.label{font-size:11px;color:var(--muted)}.setting-label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}
.goal-line{display:flex;justify-content:space-between;align-items:end;gap:8px}.goal-line>div:first-child{flex:1}.goal-value{font-size:12px;color:var(--muted);white-space:nowrap}.progress{height:8px;border-radius:999px;background:#ece9e0;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:#6f8f68;width:0;transition:width .2s}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.heat{aspect-ratio:1;border-radius:3px;background:#ece9e0;border:0}.heat.l1{background:#d8e7d3}.heat.l2{background:#b8d5b0}.heat.l3{background:#8db682}.heat.l4{background:#5f8f52}.heat.today{outline:2px solid #2c2c2a;outline-offset:1px}
.pixel-wrap{text-align:center}.pixel{display:grid;grid-template-columns:repeat(12,18px);grid-auto-rows:18px;gap:2px;justify-content:center;background:#faf9f5;padding:10px;border-radius:10px;overflow:auto}.px{width:18px;height:18px;border-radius:2px;background:#e9e6dd}.px.on{background:#7a9970}.px.dark{background:#3d4938}.px.accent{background:#c8a96b}.pixel-caption{margin-top:7px;font-size:11px;color:var(--muted)}
.log{max-height:150px;overflow-y:auto}.log-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:.5px solid #efeee8;font-size:12px}.log-item:last-child{border-bottom:none}.log-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.log-meta{color:var(--muted);white-space:nowrap}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:4px 7px;border-radius:999px;background:#f1efe8;font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.actions button{font-size:12px}
.small{font-size:11px;color:var(--muted);line-height:1.4}.hidden{display:none!important}
@media(min-width:760px){body{padding:34px 28px}.app{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(380px,.85fr);grid-template-rows:auto auto auto auto;gap:18px;align-items:start}h1{grid-column:1/-1;font-size:28px;text-align:left;margin:0 0 -2px;padding-left:4px}.card{padding:24px;margin:0;border-radius:16px}.timer{font-size:clamp(90px,8vw,126px);margin:18px 0 24px}.app>.card:nth-of-type(1){grid-column:1;grid-row:2;min-height:420px;display:flex;flex-direction:column;justify-content:center}.app>.card:nth-of-type(2){grid-column:2;grid-row:2}.app>.card:nth-of-type(3){grid-column:1;grid-row:3}.app>.card:nth-of-type(4){grid-column:2;grid-row:3}.app>.card:nth-of-type(5){grid-column:1;grid-row:4}.app>.card:nth-of-type(6){grid-column:2;grid-row:4}.app>.card:nth-of-type(7){grid-column:1/-1;grid-row:5}.memo{height:180px}.log{max-height:260px}.pixel{grid-template-columns:repeat(12,24px);grid-auto-rows:24px}.px{width:24px;height:24px}.stat{padding:14px 8px}}
@media(max-width:380px){.card{padding:13px;margin-bottom:8px}h1{font-size:18px}.timer{font-size:48px;margin:9px 0 10px}.memo{height:62px;min-height:62px}.stat{padding:8px 5px}.num{font-size:18px}.label{font-size:10px}.heatmap{gap:3px}}
</style>
</head>
<body>
<div class="app">
<h1>勉強ポモドーロタイマー</h1>
<div class="card">
  <div class="mode-wrap"><span class="mode-label mode-work" id="modeLabel">集中タイム</span></div>
  <div class="timer" id="display">25:00</div>
  <input class="task" id="taskInput" placeholder="今何を勉強していますか？">
  <div class="controls"><button class="primary" id="startBtn">開始</button><button id="skipBtn">スキップ</button><button class="reset" id="resetBtn">↺</button></div>
</div>
<div class="card">
  <div class="section-title">今回の学習</div>
  <div class="grid2"><div><label class="setting-label">科目</label><select class="select" id="subject"><option>数学</option><option>理科</option><option>英語</option><option>国語</option><option>社会</option><option>その他</option></select></div><div><label class="setting-label">内容・単元</label><input class="select" id="topic" placeholder="例：方程式"></div></div>
  <div style="margin-top:8px"><label class="setting-label">理解度</label><select class="select" id="understanding"><option value="1">★☆☆☆☆ 1 / 5</option><option value="2">★★☆☆☆ 2 / 5</option><option value="3" selected>★★★☆☆ 3 / 5</option><option value="4">★★★★☆ 4 / 5</option><option value="5">★★★★★ 5 / 5</option></select></div>
</div>
<div class="card">
  <div class="section-title">メモ</div><textarea class="memo" id="memoInput" placeholder="今日の勉強メモを書いておこう…"></textarea><div class="memo-controls"><button id="memoSaveBtn">保存</button><button id="memoClearBtn">クリア</button></div><div class="status" id="memoStatus">自動保存されています</div>
</div>
<div class="card">
  <div class="section-title">今日の目標</div>
  <div class="goal-line"><div><label class="setting-label">目標ポモドーロ数</label><input class="goal-input" type="number" id="goalInput" min="1" max="30" value="4"></div><div class="goal-value" id="goalText">0 / 4</div></div><div class="progress"><div id="goalProgress"></div></div>
  <div class="grid3" style="margin-top:9px"><div><label class="setting-label">集中(分)</label><input class="number" type="number" id="workMin" value="25" min="1" max="90"></div><div><label class="setting-label">小休憩</label><input class="number" type="number" id="shortMin" value="5" min="1" max="30"></div><div><label class="setting-label">長休憩</label><input class="number" type="number" id="longMin" value="15" min="1" max="60"></div></div>
</div>
<div class="card"><div class="section-title">今日・学習統計</div><div class="grid2"><div class="stat"><div class="num" id="sessionCount">0</div><div class="label">完了ポモドーロ</div></div><div class="stat"><div class="num" id="totalMinutes">0分</div><div class="label">学習時間</div></div></div><div id="subjectChips" class="chips" style="margin-top:9px"></div></div>
<div class="card"><div class="section-title">学習マップ</div><div class="small" style="margin-bottom:6px">勉強した日ほど濃くなります。今日は枠で表示。</div><div class="heatmap" id="heatmap"></div></div>
<div class="card"><div class="section-title">ドット絵進捗</div><div class="pixel-wrap"><div class="pixel" id="pixelArt"></div><div class="pixel-caption" id="pixelCaption">勉強すると少しずつ絵が完成します</div></div></div>
<div class="card"><div class="section-title">AI・データ</div><div class="actions"><button id="aiCopyBtn">🤖 AI分析用をコピー</button><button id="jsonBtn">📄 JSONを書き出す</button><button id="csvBtn">📊 CSVを書き出す</button><button id="importBtn">📥 JSONを読み込む</button></div><input class="hidden" id="fileInput" type="file" accept="application/json"><div class="small" style="margin-top:7px">記録は端末内に保存。AI分析用テキストをコピーして、好きなAIに貼り付けられます。</div></div>
<div class="card"><div class="section-title">記録</div><div class="log" id="log"></div></div>
</div>
<script>
const KEY='pomodoroTimerStateV3';
const ART=['............','....AAA.....','...AAAAAA....','..AAADDAA....','.AAA D DAAA..','..AAAAAAAA...','...AAAAAA....','....AAAA.....','...AA..AA....','..AA....AA...','............','............'];
let workMin=25,shortMin=5,longMin=15,mode='work',secondsLeft=1500,running=false,endAt=null,timerId=null,sessionCount=0,totalStudySeconds=0,history=[],sessions=[],daily={};
const $=id=>document.getElementById(id);const display=$('display'),modeLabel=$('modeLabel'),startBtn=$('startBtn'),skipBtn=$('skipBtn'),resetBtn=$('resetBtn'),taskInput=$('taskInput'),subject=$('subject'),topic=$('topic'),understanding=$('understanding'),memoInput=$('memoInput'),memoStatus=$('memoStatus'),goalInput=$('goalInput'),goalText=$('goalText'),goalProgress=$('goalProgress'),sessionCountEl=$('sessionCount'),totalMinutesEl=$('totalMinutes'),heatmap=$('heatmap'),pixelArt=$('pixelArt'),pixelCaption=$('pixelCaption'),subjectChips=$('subjectChips'),log=$('log');
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function format(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function duration(m){return (m==='work'?workMin:m==='short'?shortMin:longMin)*60}
function render(){display.textContent=format(secondsLeft);sessionCountEl.textContent=sessionCount;totalMinutesEl.textContent=Math.floor(totalStudySeconds/60)+'分';startBtn.textContent=running?'一時停止':'開始';modeLabel.className='mode-label '+(mode==='work'?'mode-work':mode==='short'?'mode-short':'mode-long');modeLabel.textContent=mode==='work'?'集中タイム':mode==='short'?'小休憩':'長休憩';goalText.textContent=`${sessionCount} / ${goalInput.value||4}`;goalProgress.style.width=Math.min(100,sessionCount/Math.max(1,+goalInput.value||4)*100)+'%';document.title=format(secondsLeft)+' - 勉強ポモドーロタイマー'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({date:dateKey(),workMin,shortMin,longMin,mode,secondsLeft,running,endAt,sessionCount,totalStudySeconds,history,sessions,daily,task:taskInput.value,subject:subject.value,topic:topic.value,understanding:understanding.value,memo:memoInput.value,goal:+goalInput.value||4}))}catch(e){}}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(s){workMin=+s.workMin>0?Math.min(+s.workMin,90):25;shortMin=+s.shortMin>0?Math.min(+s.shortMin,30):5;longMin=+s.longMin>0?Math.min(+s.longMin,60):15;workMinInput.value=workMin;shortMinInput.value=shortMin;longMinInput.value=longMin;goalInput.value=s.goal>0?s.goal:4;taskInput.value=s.task||'';subject.value=s.subject||subject.value;topic.value=s.topic||'';understanding.value=s.understanding||3;memoInput.value=s.memo||'';if(s.date===dateKey()){mode=['work','short','long'].includes(s.mode)?s.mode:'work';secondsLeft=Math.max(0,+s.secondsLeft||duration(mode));running=s.running===true;endAt=+s.endAt||null;sessionCount=Math.max(0,+s.sessionCount||0);totalStudySeconds=Math.max(0,+s.totalStudySeconds||0);history=Array.isArray(s.history)?s.history.slice(0,30):[];sessions=Array.isArray(s.sessions)?s.sessions.slice(-200):[];daily=s.daily&&typeof s.daily==='object'?s.daily:{}}else{mode='work';secondsLeft=duration('work');running=false;endAt=null;sessionCount=0;totalStudySeconds=0;history=[];sessions=[];daily={}}}render();renderLog();renderHeat();renderStats();renderPixel()}
function addLog(text){history.unshift({text,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});history=history.slice(0,30)}
function complete(){const k=dateKey(),mins=workMin;const rec={date:k,timestamp:new Date().toISOString(),subject:subject.value,topic:topic.value.trim(),minutes:mins,understanding:+understanding.value||3,task:taskInput.value.trim()||'無題のタスク',memo:memoInput.value.trim()};sessions.push(rec);sessions=sessions.slice(-200);daily[k]=(daily[k]||0)+1;sessionCount++;totalStudySeconds+=mins*60;addLog(`完了：${rec.subject}${rec.topic?'・'+rec.topic:''}（理解度 ${rec.understanding}/5）`);mode=sessionCount%4===0?'long':'short';secondsLeft=duration(mode);render();renderLog();renderHeat();renderStats();renderPixel();save()}
function nextMode(){clearInterval(timerId);running=false;endAt=null;complete()}
function process(){if(!running||!endAt)return;const now=Date.now();if(now<endAt){secondsLeft=Math.max(0,Math.ceil((endAt-now)/1000));render();return}let n=0;while(now>=endAt&&n<100){complete();n++;if(!running)return;endAt+=duration(mode)*1000}secondsLeft=Math.max(0,Math.ceil((endAt-now)/1000));addLog(`${n}セッション分を自動反映`);render();save()}
function tick(){if(running)process()}
function start(){if(running){secondsLeft=endAt?Math.max(0,Math.ceil((endAt-Date.now())/1000)):secondsLeft;running=false;endAt=null;clearInterval(timerId)}else{running=true;endAt=Date.now()+Math.max(1,secondsLeft)*1000;clearInterval(timerId);timerId=setInterval(tick,500)}render();save()}
function reset(){clearInterval(timerId);running=false;endAt=null;mode='work';secondsLeft=duration(mode);render();save()}
function applySettings(){workMin=Math.min(90,Math.max(1,+workMinInput.value||25));shortMin=Math.min(30,Math.max(1,+shortMinInput.value||5));longMin=Math.min(60,Math.max(1,+longMinInput.value||15));if(!running)secondsLeft=duration(mode);render();save()}
function renderLog(){log.innerHTML=history.length?history.map(h=>`<div class="log-item"><span class="log-title">${esc(h.text)}</span><span class="log-meta">${esc(h.time)}</span></div>`).join(''):'<div class="small">まだ記録がありません</div>'}
function renderStats(){const counts={};sessions.filter(s=>s.date===dateKey()).forEach(s=>counts[s.subject]=(counts[s.subject]||0)+s.minutes);subjectChips.innerHTML=Object.entries(counts).map(([k,v])=>`<span class="chip">${esc(k)} ${v}分</span>`).join('')||'<span class="chip">まだ学習記録なし</span>'}
function renderHeat(){heatmap.innerHTML='';const today=new Date();for(let i=27;i>=0;i--){const d=new Date(today);d.setDate(today.getDate()-i);const k=dateKey(d),v=daily[k]||0,el=document.createElement('div');el.className='heat '+(v>=4?'l4':v>=2?'l3':v>=1?'l1':'')+(i===0?' today':'');el.title=`${k}: ${v}ポモドーロ`;heatmap.appendChild(el)}}
function renderPixel(){const done=sessions.filter(s=>s.date===dateKey()).length;const total=Math.min(144,done*8);pixelArt.innerHTML='';let on=0;ART.join('').split('').forEach(ch=>{const el=document.createElement('div');el.className='px';if(ch!==' '&&ch!=='.'&&on<total){el.classList.add(ch==='D'?'dark':ch==='A'?'on':'accent');on++}pixelArt.appendChild(el)});pixelCaption.textContent=done?`今日 ${done}ポモドーロ。ドット絵 ${Math.min(100,Math.round(total/1.44))}%`:'勉強すると少しずつ絵が完成します'}
function aiText(){const today=sessions.filter(s=>s.date===dateKey());const lines=today.map(s=>`${s.date} | ${s.subject} | ${s.topic||'—'} | ${s.minutes}分 | 理解度${s.understanding}/5 | ${s.task} | ${s.memo||'—'}`);return `以下は私の学習記録です。学習量だけでなく理解度も考慮して分析してください。\n\n分析してほしいこと：\n1. 科目ごとの学習時間と理解度\n2. 勉強時間に対して理解度が低い分野\n3. 復習優先順位\n4. 学習傾向\n5. 次の1週間でおすすめの学習内容\n\n【学習記録】\n${lines.join('\n')||'本日の記録はありません'}`}
async function copyAI(){try{await navigator.clipboard.writeText(aiText());memoStatus.textContent='AI分析用データをコピーしました'}catch(e){prompt('コピーできませんでした。以下をコピーしてください',aiText())}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download(`pomodoro-${dateKey()}.json`,JSON.stringify({version:3,exportedAt:new Date().toISOString(),sessions,daily},null,2),'application/json')}
function exportCSV(){const rows=[['date','subject','topic','minutes','understanding','task','memo'],...sessions.map(s=>[s.date,s.subject,s.topic,s.minutes,s.understanding,s.task,s.memo])];download(`pomodoro-${dateKey()}.csv`,rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
startBtn.onclick=start;skipBtn.onclick=nextMode;resetBtn.onclick=reset;$('memoSaveBtn').onclick=()=>{save();memoStatus.textContent='保存しました'};$('memoClearBtn').onclick=()=>{memoInput.value='';save();memoStatus.textContent='メモをクリアしました'};$('aiCopyBtn').onclick=copyAI;$('jsonBtn').onclick=exportJSON;$('csvBtn').onclick=exportCSV;$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(Array.isArray(x.sessions))sessions=x.sessions.slice(-200);if(x.daily&&typeof x.daily==='object')daily=x.daily;sessionCount=sessions.filter(s=>s.date===dateKey()).length;totalStudySeconds=sessions.filter(s=>s.date===dateKey()).reduce((a,s)=>a+s.minutes*60,0);save();render();renderLog();renderHeat();renderStats();renderPixel();memoStatus.textContent='読み込みました'}catch(err){memoStatus.textContent='読み込みに失敗しました'}};r.readAsText(f)};goalInput.onchange=()=>{goalInput.value=Math.min(30,Math.max(1,+goalInput.value||4));render();save()};[workMinInput,shortMinInput,longMinInput].forEach(e=>e.onchange=applySettings);taskInput.oninput=save;subject.onchange=save;topic.oninput=save;understanding.onchange=save;memoInput.oninput=()=>{memoStatus.textContent='自動保存中…';clearTimeout(memoInput._t);memoInput._t=setTimeout(save,300)};document.addEventListener('visibilitychange',()=>{if(!document.hidden)process();save()});window.addEventListener('beforeunload',save);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();process();if(running)timerId=setInterval(tick,500);
</script>
</body>
</html>
